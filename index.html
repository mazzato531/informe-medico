<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#8B0000" />
<title>Informes Médicos · Dra. Silvia Vargas Hernández</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --rojo:#8B0000;
    --rojo-claro:#a52020;
    --bg:#f6f2f2;
    --card:#ffffff;
    --borde:#e4dede;
    --texto:#1f2937;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--texto);
    font-size:16px;
    line-height:1.5;
    padding-bottom:100px;
  }
  /* ===== HEADER APP ===== */
  .app-header{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--borde);
    padding:10px 16px;
    display:flex;align-items:center;gap:10px;
  }
  .logo{
    width:40px;height:40px;border-radius:7px;background:var(--rojo);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .app-header h1{font-size:15px;margin:0;color:var(--rojo);font-weight:700;line-height:1.15;}
  .app-header .sub{font-size:11px;color:var(--muted);line-height:1.15;}
  main{max-width:720px;margin:0 auto;padding:16px;}
  /* ===== CARDS ===== */
  .card{
    background:var(--card);
    border:1px solid var(--borde);
    border-radius:14px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;cursor:pointer;user-select:none;
    font-weight:600;font-size:15px;
  }
  .card-head .chev{transition:transform .2s;color:var(--muted);}
  .card.open .card-head .chev{transform:rotate(180deg);}
  .card-body{padding:0 16px 16px;display:none;}
  .card.open .card-body{display:block;}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:#374151;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:9px;
    font-size:16px;font-family:inherit;color:var(--texto);background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rojo);box-shadow:0 0 0 3px rgba(139,0,0,.08);}
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:120px;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  /* toggle estudio */
  .estudio-head{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:25px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--rojo);}
  .switch input:checked + .slider:before{transform:translateX(19px);}
  .estudio-label{font-weight:600;font-size:14px;}
  .estudio-campos{margin-top:10px;display:none;}
  .estudio-campos.show{display:block;}
  /* botones */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border-radius:10px;font-size:15px;font-weight:600;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--rojo);color:#fff;}
  .btn-primary:active{background:var(--rojo-claro);}
  .btn-outline{background:#fff;color:var(--rojo);border:1px solid var(--rojo);}
  .btn-ghost{background:#f3f4f6;color:#374151;}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .btn-block{width:100%;}
  /* chips diagnósticos / tratamientos */
  .chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fdf5f5;border:1px solid #f0d9d9;border-radius:9px;
    padding:9px 12px;margin-bottom:8px;font-size:14px;
  }
  .chip button{background:none;border:none;color:var(--rojo);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}
  /* selector patologías modal */
  .modal-back{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-back.show{display:flex;}
  .modal{
    background:#fff;width:100%;max-width:720px;max-height:85vh;
    border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  }
  @media(min-width:600px){
    .modal-back{align-items:center;}
    .modal{border-radius:16px;max-height:80vh;}
  }
  .modal-head{padding:14px 16px;border-bottom:1px solid var(--borde);display:flex;gap:10px;align-items:center;}
  .modal-head input{flex:1;}
  .modal-list{overflow-y:auto;padding:8px 0;flex:1;-webkit-overflow-scrolling:touch;}
  .cat-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--rojo);padding:10px 16px 4px;}
  .pat-item{padding:11px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid #f5f0f0;}
  .pat-item:active{background:#fdf5f5;}
  /* footer barra acciones */
  .actionbar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--borde);
    padding:12px 16px;display:flex;gap:10px;
    max-width:720px;margin:0 auto;
  }
  .actionbar .btn{flex:1;}
  /* toast */
  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:#1f2937;color:#fff;padding:10px 18px;border-radius:9px;
    font-size:14px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  /* ===== VISTA PREVIA / PDF ===== */
  #vistaWrap{display:none;}
  #vistaWrap.show{display:block;}
  .pdf-page{
    background:#fff;color:#1a1a1a;
    font-family:Georgia,'Times New Roman',serif;
    font-size:14px;line-height:1.55;
    padding:40px 46px;
    max-width:780px;margin:0 auto;
    border:1px solid var(--borde);border-radius:6px;
  }
  .pdf-header{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--rojo);padding-bottom:14px;margin-bottom:18px;}
  .pdf-logo{width:56px;height:56px;background:var(--rojo);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pdf-header .nom{font-size:19px;font-weight:700;color:var(--rojo);}
  .pdf-header .esp{font-size:13px;font-weight:600;letter-spacing:.03em;}
  .pdf-fecha{text-align:right;margin-bottom:18px;}
  .pdf-titulo{text-align:center;font-weight:700;text-decoration:underline;font-size:15px;margin-bottom:18px;}
  .pdf-p{text-align:justify;margin-bottom:14px;}
  .pdf-block{margin-bottom:14px;}
  .pdf-block .lbl{font-weight:700;}
  .pdf-firma{margin-top:34px;text-align:center;page-break-inside:avoid;break-inside:avoid;}
  .pdf-firma .sig{font-family:'Dancing Script',cursive;font-size:36px;}
  .pdf-firma .line{border-top:1px solid #333;width:260px;margin:2px auto 6px;}
  .pdf-firma .n1{font-weight:700;font-size:13px;}
  .pdf-firma .n2{font-size:13px;}
  .pdf-firma .n3{font-size:11px;color:#555;}
  .pdf-footer{margin-top:20px;padding-top:8px;border-top:1px solid #ccc;font-size:10.5px;color:#555;text-align:center;page-break-inside:avoid;break-inside:avoid;}
  .seg{display:flex;background:#f3f4f6;border-radius:10px;padding:4px;margin-bottom:14px;}
  .seg button{flex:1;padding:9px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .seg button.active{background:#fff;color:var(--rojo);box-shadow:0 1px 2px rgba(0,0,0,.1);}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo" style="background:transparent;border-radius:0;">
    <svg width="34" height="45" viewBox="0 0 48 64"><rect x="0" y="0" width="48" height="64" rx="7" fill="#b52d27"/> <rect x="5" y="19" width="38" height="26" fill="#ffffff"/> <g fill="#ffffff"> <rect x="7" y="6" width="1.9" height="13"/> <rect x="11" y="6" width="1.9" height="13"/> <rect x="15" y="6" width="1.9" height="13"/> <rect x="19" y="6" width="1.9" height="13"/> <rect x="23" y="6" width="1.9" height="13"/> <rect x="27" y="6" width="1.9" height="13"/> <rect x="31" y="6" width="1.9" height="13"/> <rect x="35" y="6" width="1.9" height="13"/> <rect x="39" y="6" width="1.9" height="13"/> </g> <g fill="#ffffff"> <rect x="7" y="45" width="1.9" height="13"/> <rect x="11" y="45" width="1.9" height="13"/> <rect x="15" y="45" width="1.9" height="13"/> <rect x="19" y="45" width="1.9" height="13"/> <rect x="23" y="45" width="1.9" height="13"/> <rect x="27" y="45" width="1.9" height="13"/> <rect x="31" y="45" width="1.9" height="13"/> <rect x="35" y="45" width="1.9" height="13"/> <rect x="39" y="45" width="1.9" height="13"/> </g> <rect x="16" y="10" width="5.5" height="34" rx="1.5" fill="#b52d27"/> <circle cx="27" cy="34" r="9.5" fill="#b52d27"/> <circle cx="28" cy="34.5" r="3.6" fill="#ffffff"/></svg>
  </div>
  <div>
    <h1>Dra. Silvia Vargas Hernández</h1>
    <div class="sub">Obstetricia · Ginecología · Menopausia</div>
  </div>
</header>

<main>
  <!-- ============ FORMULARIO ============ -->
  <div id="formWrap">
    <div class="seg">
      <button type="button" id="tipoEstandar" class="active" onclick="setTipo('estandar')">Informe estándar</button>
      <button type="button" id="tipoAntec" onclick="setTipo('antecedentes')">Con antecedentes</button>
    </div>

    <!-- Datos paciente -->
    <div class="card open">
      <div class="card-head" onclick="toggleCard(this)">Datos de la paciente <span class="chev">▾</span></div>
      <div class="card-body">
        <label>Nombre completo</label>
        <input type="text" id="nombrePaciente" placeholder="Ej: Renee Figuera" />
        <div class="row">
          <div><label>Edad</label><input type="number" id="edad" placeholder="50" /></div>
          <div><label>C.I. / DNI</label><input type="text" id="cedula" placeholder="V- 12.821.883" /></div>
        </div>
        <div class="row">
          <div><label>Fecha de nacimiento</label><input type="date" id="fechaNacimiento" /></div>
          <div><label>Fecha de consulta</label><input type="date" id="fechaConsulta" /></div>
        </div>
        <label>Motivo de consulta</label>
        <textarea id="motivoConsulta" placeholder="presentar ardor vaginal"></textarea>
      </div>
    </div>

    <!-- Antecedentes -->
    <div class="card" id="cardAntec" style="display:none;">
      <div class="card-head" onclick="toggleCard(this)">Antecedentes <span class="chev">▾</span></div>
      <div class="card-body">
        <label>Antecedentes médicos / quirúrgicos</label>
        <textarea id="antecedentes" placeholder="Histerectomía vaginal más colpo perineoplastia."></textarea>
      </div>
    </div>

    <!-- Examen físico -->
    <div class="card">
      <div class="card-head" onclick="toggleCard(this)">Examen físico <span class="chev">▾</span></div>
      <div class="card-body">
        <label>Hallazgos del examen físico ginecológico</label>
        <textarea id="examenFisico" placeholder="Se practicó examen físico ginecológico, se tomó citología, colposcopia y ecosonograma transvaginal."></textarea>
      </div>
    </div>

    <!-- Estudios -->
    <div class="card">
      <div class="card-head" onclick="toggleCard(this)">Estudios complementarios <span class="chev">▾</span></div>
      <div class="card-body" id="estudiosBody"></div>
    </div>

    <!-- Impresión diagnóstica -->
    <div class="card open">
      <div class="card-head" onclick="toggleCard(this)">Impresión diagnóstica <span class="chev">▾</span></div>
      <div class="card-body">
        <div id="listaDiag"></div>
        <button type="button" class="btn btn-outline btn-sm btn-block" onclick="abrirSelector()">+ Agregar diagnóstico</button>
      </div>
    </div>

    <!-- Tratamiento -->
    <div class="card">
      <div class="card-head" onclick="toggleCard(this)">Tratamiento indicado <span class="chev">▾</span></div>
      <div class="card-body">
        <div id="listaTrat"></div>
        <label>Medicamento / indicación</label>
        <div class="row">
          <div style="flex:3;"><input type="text" id="nuevoTrat" placeholder="Ej: Fosfomicina 3mg" onkeydown="if(event.key==='Enter'){event.preventDefault();agregarTrat();}" /></div>
          <div style="flex:0;min-width:auto;"><button type="button" class="btn btn-outline" onclick="agregarTrat()">+</button></div>
        </div>
      </div>
    </div>

    <!-- Observaciones -->
    <div class="card">
      <div class="card-head" onclick="toggleCard(this)">Observaciones adicionales <span class="chev">▾</span></div>
      <div class="card-body">
        <textarea id="observaciones" placeholder="Opcional"></textarea>
      </div>
    </div>

    <button type="button" class="btn btn-ghost btn-sm btn-block" style="margin-top:4px;" onclick="limpiarTodo()">Limpiar formulario</button>
  </div>

  <!-- ============ VISTA PREVIA ============ -->
  <div id="vistaWrap">
    <div class="pdf-page" id="pdfContent"></div>
  </div>
</main>

<!-- barra de acciones -->
<div class="actionbar">
  <button type="button" class="btn btn-outline" id="btnVista" onclick="toggleVista()">Vista previa</button>
  <button type="button" class="btn btn-primary" onclick="descargarPDF()">Descargar PDF</button>
</div>

<!-- selector patologías -->
<div class="modal-back" id="selectorBack">
  <div class="modal">
    <div class="modal-head">
      <input type="text" id="buscarPat" placeholder="Buscar patología..." oninput="filtrarPat()" />
      <button type="button" class="btn btn-ghost btn-sm" onclick="cerrarSelector()">Cerrar</button>
    </div>
    <div class="modal-list" id="listaPat"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* estudios: id, label, tipo de campo */
const ESTUDIOS=[
  {id:'citologia',label:'Citología',opciones:OPC_CITOLOGIA,libre:true},
  {id:'colposcopia',label:'Colposcopia',opciones:OPC_COLPOSCOPIA,libre:true},
  {id:'ecosonograma',label:'Ecosonograma transvaginal',opciones:OPC_ECO,libre:true},
  {id:'mamografia',label:'Mamografía / Eco mamario',birads:true},
  {id:'densitometria',label:'Densitometría ósea',opciones:OPC_DENSITO,libre:true},
  {id:'resonancia',label:'Resonancia magnética',libre:true},

  {id:'urocultivo',label:'Examen de orina / Urocultivo',libre:true},
];

/* ================= ESTADO ================= */
let estado = {
  tipo:'estandar',
  diagnosticos:[],
  tratamientos:[],
};

/* ================= HELPERS ================= */
function $(id){return document.getElementById(id);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function toggleCard(h){h.parentElement.classList.toggle('open');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setTipo(t){
  estado.tipo=t;
  $('tipoEstandar').classList.toggle('active',t==='estandar');
  $('tipoAntec').classList.toggle('active',t==='antecedentes');
  $('cardAntec').style.display = t==='antecedentes' ? 'block' : 'none';
  if(t==='antecedentes') $('cardAntec').classList.add('open');
  guardar();
}

/* ============ ESTUDIOS UI ============ */
function renderEstudios(){
  const cont=$('estudiosBody');
  cont.innerHTML='';
  ESTUDIOS.forEach(e=>{
    const wrap=document.createElement('div');
    wrap.style.borderBottom='1px solid #f2eaea';
    wrap.style.padding='10px 0';
    let campos='';
    if(e.birads){
      campos=`<label>BIRADS</label><select id="${e.id}_birads" onchange="guardar()"><option value="">—</option>${OPC_BIRADS.map(o=>`<option>${o}</option>`).join('')}</select>
        <label>Texto adicional</label><textarea id="${e.id}_texto" oninput="guardar()" placeholder="No se evidencian signos de malignidad. Control anual."></textarea>`;
    } else {
      let opts='';
      if(e.opciones){opts=`<label>Resultado (seleccionar)</label><select id="${e.id}_sel" onchange="onSelEstudio('${e.id}')"><option value="">— seleccionar o escribir abajo —</option>${e.opciones.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;}
      campos=`${opts}<label>Resultado</label><textarea id="${e.id}_res" oninput="guardar()" placeholder="Escriba el resultado"></textarea>`;
    }
    wrap.innerHTML=`<div class="estudio-head">
        <label class="switch" style="margin:0;"><input type="checkbox" id="${e.id}_on" onchange="onToggleEstudio('${e.id}')"><span class="slider"></span></label>
        <span class="estudio-label">${e.label}</span>
      </div>
      <div class="estudio-campos" id="${e.id}_campos">${campos}</div>`;
    cont.appendChild(wrap);
  });
}
function onToggleEstudio(id){
  const on=$(id+'_on').checked;
  $(id+'_campos').classList.toggle('show',on);
  guardar();
}
function onSelEstudio(id){
  const v=$(id+'_sel').value;
  if(v){$(id+'_res').value=v;}
  guardar();
}

/* ============ DIAGNÓSTICOS ============ */
function renderDiag(){
  const c=$('listaDiag');
  c.innerHTML='';
  estado.diagnosticos.forEach((d,i)=>{
    const div=document.createElement('div');
    div.className='chip';
    div.innerHTML=`<span>${esc(d)}</span><button type="button" onclick="quitarDiag(${i})">×</button>`;
    c.appendChild(div);
  });
}
function quitarDiag(i){estado.diagnosticos.splice(i,1);renderDiag();guardar();}

/* ============ TRATAMIENTOS ============ */
function agregarTrat(){
  const v=$('nuevoTrat').value.trim();
  if(!v)return;
  estado.tratamientos.push(v);
  $('nuevoTrat').value='';
  renderTrat();guardar();
}
function renderTrat(){
  const c=$('listaTrat');
  c.innerHTML='';
  estado.tratamientos.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='chip';
    div.innerHTML=`<span>${esc(t)}</span><button type="button" onclick="quitarTrat(${i})">×</button>`;
    c.appendChild(div);
  });
}
function quitarTrat(i){estado.tratamientos.splice(i,1);renderTrat();guardar();}

/* ============ SELECTOR PATOLOGÍAS ============ */
function abrirSelector(){$('selectorBack').classList.add('show');$('buscarPat').value='';renderPat('');setTimeout(()=>$('buscarPat').focus(),100);}
function cerrarSelector(){$('selectorBack').classList.remove('show');}
function filtrarPat(){renderPat($('buscarPat').value.toLowerCase());}
function renderPat(q){
  const c=$('listaPat');
  c.innerHTML='';
  PATOLOGIAS.forEach(cat=>{
    const items=cat.items.filter(it=>it.toLowerCase().includes(q));
    if(!items.length)return;
    const t=document.createElement('div');t.className='cat-title';t.textContent=cat.categoria;c.appendChild(t);
    items.forEach(it=>{
      const d=document.createElement('div');d.className='pat-item';d.textContent=it;
      d.onclick=()=>{estado.diagnosticos.push(it);renderDiag();guardar();cerrarSelector();toast('Diagnóstico agregado');};
      c.appendChild(d);
    });
  });
  if(q){
    const d=document.createElement('div');d.className='pat-item';d.style.color='#8B0000';d.style.fontWeight='600';
    d.textContent='+ Agregar "'+$('buscarPat').value+'" (texto libre)';
    d.onclick=()=>{const v=$('buscarPat').value.trim();if(v){estado.diagnosticos.push(v);renderDiag();guardar();cerrarSelector();toast('Diagnóstico agregado');}};
    c.appendChild(d);
  }
}
$('selectorBack').addEventListener('click',e=>{if(e.target===$('selectorBack'))cerrarSelector();});

/* ============ RECOLECTAR DATOS ============ */
function recolectar(){
  const d={
    tipo:estado.tipo,
    nombrePaciente:$('nombrePaciente').value,
    edad:$('edad').value,
    cedula:$('cedula').value,
    fechaNacimiento:$('fechaNacimiento').value,
    fechaConsulta:$('fechaConsulta').value,
    motivoConsulta:$('motivoConsulta').value,
    antecedentes:$('antecedentes').value,
    examenFisico:$('examenFisico').value,
    diagnosticos:estado.diagnosticos,
    tratamientos:estado.tratamientos,
    observaciones:$('observaciones').value,
    estudios:{}
  };
  ESTUDIOS.forEach(e=>{
    const on=$(e.id+'_on') && $(e.id+'_on').checked;
    if(e.birads){
      d.estudios[e.id]={on,birads:$(e.id+'_birads')?$(e.id+'_birads').value:'',texto:$(e.id+'_texto')?$(e.id+'_texto').value:''};
    } else {
      d.estudios[e.id]={on,res:$(e.id+'_res')?$(e.id+'_res').value:''};
    }
  });
  return d;
}

/* ============ PERSISTENCIA ============ */
function guardar(){try{localStorage.setItem('gineco_informe',JSON.stringify(recolectar()));}catch(e){}}
function cargar(){
  let d;try{d=JSON.parse(localStorage.getItem('gineco_informe'));}catch(e){}
  if(!d)return;
  setTipo(d.tipo||'estandar');
  $('nombrePaciente').value=d.nombrePaciente||'';
  $('edad').value=d.edad||'';
  $('cedula').value=d.cedula||'';
  $('fechaNacimiento').value=d.fechaNacimiento||'';
  $('fechaConsulta').value=d.fechaConsulta||'';
  $('motivoConsulta').value=d.motivoConsulta||'';
  $('antecedentes').value=d.antecedentes||'';
  $('examenFisico').value=d.examenFisico||'';
  $('observaciones').value=d.observaciones||'';
  estado.diagnosticos=d.diagnosticos||[];
  estado.tratamientos=d.tratamientos||[];
  renderDiag();renderTrat();
  if(d.estudios){
    ESTUDIOS.forEach(e=>{
      const s=d.estudios[e.id];if(!s)return;
      if($(e.id+'_on')){$(e.id+'_on').checked=!!s.on;$(e.id+'_campos').classList.toggle('show',!!s.on);}
      if(e.birads){if($(e.id+'_birads'))$(e.id+'_birads').value=s.birads||'';if($(e.id+'_texto'))$(e.id+'_texto').value=s.texto||'';}
      else{if($(e.id+'_res'))$(e.id+'_res').value=s.res||'';}
    });
  }
}

/* ============ FECHAS ============ */
function fmtFecha(str){
  if(!str)return '';
  const d=new Date(str+'T00:00:00');
  if(isNaN(d.getTime()))return str;
  return d.toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});
}
function hoyStr(){return new Date().toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric'});}

/* ============ VISTA PREVIA ============ */
function toggleVista(){
  const v=$('vistaWrap'), f=$('formWrap'), b=$('btnVista');
  if(v.classList.contains('show')){
    v.classList.remove('show');f.style.display='block';b.textContent='Vista previa';
  } else {
    $('pdfContent').innerHTML=construirInforme();
    v.classList.add('show');f.style.display='none';b.textContent='Volver a editar';
    window.scrollTo(0,0);
  }
}

/* ============ DESCARGAR PDF ============ */
let _generandoPDF=false;
async function descargarPDF(){
  if(_generandoPDF) return;
  _generandoPDF=true;
  let host=null;
  try{
    guardar();
    host=document.createElement('div');
    host.setAttribute('aria-hidden','true');
    host.style.cssText='position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:auto;z-index:-1;opacity:.01;pointer-events:none;background:#fff;';

    const cont=document.createElement('div');
    cont.className='pdf-page';
    cont.style.cssText='width:780px;max-width:none;min-height:1px;background:#fff;margin:0;border:none;border-radius:0;box-sizing:border-box;';
    cont.innerHTML=construirInforme();
    host.appendChild(cont);
    document.body.appendChild(host);

    const nombre=($('nombrePaciente').value||'informe').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,'').trim().replace(/\s+/g,'_');
    toast('Generando PDF...');

    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const imgs=Array.from(cont.querySelectorAll('img'));
    await Promise.all(imgs.map(im=>{
      if(im.complete && im.naturalWidth>0) return Promise.resolve();
      return new Promise(resolve=>{ im.onload=resolve; im.onerror=resolve; setTimeout(resolve,3000); });
    }));
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);

    const opt={
      margin:[10,8,12,8],
      filename:`Informe_${nombre||'medico'}.pdf`,
      image:{type:'jpeg',quality:.95},
      html2canvas:{scale:Math.min(2,window.devicePixelRatio||2),useCORS:true,allowTaint:true,backgroundColor:'#fff',width:780,windowWidth:780,x:0,y:0,scrollX:0,scrollY:0},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
      pagebreak:{mode:['css','legacy']}
    };

    await html2pdf().set(opt).from(cont).save();
    toast('PDF listo');
  }catch(e){
    console.error('Error generando PDF:',e);
    toast('No se pudo generar el PDF. Intenta nuevamente.');
  }finally{
    if(host && host.parentNode) host.parentNode.removeChild(host);
    _generandoPDF=false;
  }
}
